# Indique à Spring d'utiliser H2 en mémoire
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crée les tables au démarrage du test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

#Propriètés JWT
infoasso.app.jwtSecret=MaCleSecreteDeTestSuperLonguePourPasserLesValidationsJWT123456
infoasso.app.jwtExpirationMs=3600000